# Publica la web en GitHub Pages cada vez que se sube un cambio a la rama main.
# Requisito: en el repositorio, Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar, construir y preparar la web
        uses: withastro/action@v3
        with:
          node-version: 24
        # ID de los píxeles: Settings → Secrets and variables → Actions → Variables. Vacías = píxel desactivado.
        env:
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          PUBLIC_TIKTOK_PIXEL_ID: ${{ vars.PUBLIC_TIKTOK_PIXEL_ID }}
          PUBLIC_META_DOMAIN_VERIFICATION: ${{ vars.PUBLIC_META_DOMAIN_VERIFICATION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
